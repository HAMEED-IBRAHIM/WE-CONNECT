# =============================================
# WE-CONNECT — PRODUCTION Configuration
# Activate with: SPRING_PROFILES_ACTIVE=prod
# =============================================

# Server
server.port=${PORT:8080}
server.servlet.context-path=/api

# =============================================
# PostgreSQL Database (Neon / Railway / Supabase)
# Set DATABASE_URL env var on your hosting provider
# Format: jdbc:postgresql://host:5432/dbname
# =============================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Disable H2 console in production
spring.h2.console.enabled=false

# JWT Configuration — use a strong secret in production!
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=2592000000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# Logging
logging.level.com.alumni.platform=INFO
logging.level.org.springframework.security=WARN

# CORS — allow your Vercel frontend domain
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# =============================================
# RESEND EMAIL (real OTP emails)
# =============================================
spring.mail.host=smtp.resend.com
spring.mail.port=465
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.resend.com

# From address — change to your verified domain on Resend for production
app.mail.from=${MAIL_FROM:WE-CONNECT <onboarding@resend.dev>}

# =============================================
# GOOGLE OAUTH
# =============================================
app.google.client-id=${GOOGLE_CLIENT_ID:215142261502-9a1g4ar4m8bdr68ru0v8u4ks6bagbp2e.apps.googleusercontent.com}
