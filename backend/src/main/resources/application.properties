# Server
server.port=8080
server.servlet.context-path=/api

# H2 Database (file-based — data persists between restarts)
spring.datasource.url=jdbc:h2:file:./data/alumni_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=2592000000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# Logging
logging.level.com.alumni.platform=INFO
logging.level.org.springframework.security=WARN

# CORS (allow React dev server)
app.cors.allowed-origins=http://localhost:3000

# AI Configuration
gemini.api.key=YOUR_GEMINI_API_KEY_HERE

# =============================================
# RESEND EMAIL (real OTP emails)
# Get your free API key at: https://resend.com
# =============================================
spring.mail.host=smtp.resend.com
spring.mail.port=465
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY:YOUR_RESEND_API_KEY_HERE}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.resend.com

# From address — must be a verified domain in Resend OR use onboarding@resend.dev for testing
app.mail.from=WE-CONNECT <onboarding@resend.dev>

